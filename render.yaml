services:
  - type: web
    name: clubhub
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app --bind 0.0.0.0:$PORT --workers 2 --preload
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: CLUB_NAME
        value: CLB Lập trình Python
      - key: GEMINI_API_KEY
        sync: false
